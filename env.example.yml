# Copy this file to env.yml and replace the example values.
# env.yml is gitignored. Supply the PRIVATE key's path, never its contents.
ssh_user: your_username
ssh_key: ~/.ssh/id_ed25519

# 0: refresh at launch and on click. Set 10 or higher for automatic refresh.
refresh_seconds: 0

# Minimum time between folder scans, including manual refreshes (at least 60).
# Scans run at launch and on the next refresh after this interval expires.
folder_refresh_seconds: 300

targets:
  # cluster groups machines; name must be unique within its cluster.
  # host is the actual SSH hostname, IP address, or SSH config alias.
  - cluster: lab-a
    name: gpu01
    host: gpu01.example.edu
    # Filesystem capacity at these absolute remote paths:
    disk_paths:
      - /
      - /scratch
    # Allocated space used by these directories (same filesystem only):
    folder_paths:
      - /scratch/your_username/runs

  - cluster: lab-b
    name: gpu01
    host: gpu01.other.edu
    port: 22
    # Optional per-host overrides:
    # user: another_username
    # identity_file: ~/.ssh/another_private_key
    # Omit storage paths or set [] to disable their checks on this host.
    disk_paths: []
    folder_paths: []
