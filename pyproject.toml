[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gpu-avail-tracker"
version = "0.1.0"
description = "A read-only terminal dashboard for GPU processes on SSH hosts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8.0,<9"]

[project.scripts]
gpu-avail = "gpu_avail_tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_avail_tracker"]
