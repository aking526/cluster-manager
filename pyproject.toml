[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "cluster-manager"
version = "0.1.0"
description = "A local web dashboard for GPU processes on SSH hosts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7"]

[project.scripts]
cluster-manager = "gpu_avail_tracker.cli:main"
gpu-avail = "gpu_avail_tracker.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpu_avail_tracker"]
